name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Validate manifests and frontmatter
        run: node scripts/validate.mjs
      - name: Detect UI defects in the site (the "before" demos are bad on purpose)
        run: node skills/pristine/scripts/detect.mjs $(find site/src -type f \( -name '*.astro' -o -name '*.css' \) ! -name 'before.astro')

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
