name: Idea
description: A rule, Lens or pattern that would make Pristine's output better.
labels: ["idea"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What went wrong without it
      description: A real page or session where Pristine missed this. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: The rule
      description: Write it as something an agent can check, with a value or threshold.
    validations:
      required: true
